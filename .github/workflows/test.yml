name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment files
        run: |
          cp .env.test.example .env.test
          cp .env.example .env

      - name: Run tests with Docker Compose
        run: |
          docker compose --profile ci up --abort-on-container-exit --exit-code-from test

      - name: Cleanup
        if: always()
        run: docker compose --profile ci down -v

      - name: Remove node_modules created by Docker
        if: github.ref == 'refs/heads/main'
        run: sudo rm -rf node_modules

      - name: Set up Node.js (for Swagger build)
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (for Swagger build)
        if: github.ref == 'refs/heads/main'
        run: npm ci

      - name: Build Swagger documentation
        if: github.ref == 'refs/heads/main'
        run: npm run build:swagger

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
          commit_message: 'Deploy Swagger documentation'

  # Black-box smoke gate: the full stack in Docker, API and UI suites against it
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment files
        run: |
          cp .env.docker.example .env
          cp .env.test.example .env.test

      - name: Start db, API and frontend
        run: docker compose up --build --detach --wait

      - name: Run API smoke suites
        run: docker compose run --rm api-smoke

      - name: Run UI smoke suites
        run: docker compose run --rm ui-smoke

      - name: Upload Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose --profile smoke down -v
