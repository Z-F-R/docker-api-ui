services:
  app:
    build: .
    container_name: my_app
    env_file:
      - .env
    ports:
      # Published on localhost only: the API is a test stand, not for the LAN
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev
      - ci
      - e2e
      - smoke

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: my_frontend
    env_file:
      - .env
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - dev
      - e2e
      - smoke

  db:
    image: postgres:16
    container_name: my_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - ci
      - e2e
      - smoke

  test:
    build: .
    container_name: my_test
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    entrypoint: ["/entrypoint-test.sh"]
    command: npm run test
    profiles:
      - ci

  # Black-box API smoke suites: hit the running API container over HTTP
  # Run: docker compose run --rm api-smoke
  api-smoke:
    build: .
    container_name: my_api_smoke
    # Only what the runner needs - no DB password or JWT secret from .env
    environment:
      API_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./smoke:/app/smoke:ro
    # Skip the app entrypoint (migrations) - the smoke runner only sends HTTP requests
    entrypoint: []
    command: npm run test:smoke
    profiles:
      - smoke

  # Playwright UI smoke suites in the official Playwright image (browsers do not run on Alpine)
  # Run: docker compose run --rm ui-smoke
  ui-smoke:
    build: ./e2e
    container_name: my_ui_smoke
    # Only what the runner needs - no DB password or JWT secret from .env
    environment:
      # Taken from the host: set in CI (retries, forbidOnly), empty when debugging locally
      CI: ${CI:-}
      # Linux hosts: owner for the report folders, e.g. HOST_UID=$(id -u) HOST_GID=$(id -g)
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./e2e/tests:/e2e/tests:ro
      - ./e2e/playwright.config.js:/e2e/playwright.config.js:ro
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    profiles:
      - smoke
      - e2e

volumes:
  db_data:
